name: MoE-POT-Tiny-NS-FT200
file: finetune.py

model: MoEPOT
dataset: ns2d
use_writer: True
res: 128
modes: 32
patch_size: 8
lr: 0.001
lr_method: cycle
warmup_epochs: 40
epochs: 200
noise_scale: 0.0
T_in: 10
T_ar: 1
T_bundle: 1
use_ln: 1
normalize: 0
grad_clip: 10000.0
beta1: 0.9
beta2: 0.9
n_channels: 4
n_class: 6
n_layers: 4
n_blocks: 4
mlp_ratio: 1
width: 512

# run_moepot.sh passes this path explicitly so both datasets start from the
# same public pretrained checkpoint.
resume_path: /model/nestor_moepot_tiny/model_moepot_tiny.pth

# Documentation for the two independent FT200 runs. run_all_ft200.sh executes
# them sequentially on the same 4090 and validates the first run before the
# second starts.
recipes:
  ns1e-5:
    dataset_id: ns2d_fno_1e-5
    train_samples: 1000
    test_samples: 200
    test_rollout_steps: 10
  ns1e-3:
    dataset_id: ns2d_fno_1e-3
    train_samples: 1000
    test_samples: 200
    test_rollout_steps: 20
