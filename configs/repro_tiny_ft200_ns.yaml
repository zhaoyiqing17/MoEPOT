name: MoE-POT-Tiny-NS-FT200
file: finetune.py

model: MoEPOT
dataset: ns2d
use_writer: True
res: 128
modes: 32
patch_size: 8
lr: 0.001
lr_method: cycle
warmup_epochs: 40
epochs: 200
noise_scale: 0.0
T_in: 10
T_ar: 1
T_bundle: 1
use_ln: 1
normalize: 0
grad_clip: 10000.0
beta1: 0.9
beta2: 0.9
n_channels: 4
n_class: 6
n_layers: 4
n_blocks: 4
mlp_ratio: 1
width: 512

# The run script passes this path explicitly so both datasets start from the
# same pretrained checkpoint. It can be overridden on BitaHub if required.
resume_path: /model/nestor_moepot_tiny/model_moepot_tiny.pth

# The two rows are documentation for the two independent FT200 runs. The run
# script executes them sequentially on a single 4090 instead of relying on
# trainer.py's GPU discovery, which rejects cards with more than 800 MB in use.
recipes:
  ns1e-5:
    dataset_id: ns2d_fno_1e-5
    train_samples: 1000
    test_samples: 200
    test_rollout_steps: 10
  ns1e-3:
    dataset_id: ns2d_fno_1e-3
    train_samples: 1000
    test_samples: 200
    test_rollout_steps: 20
